[project]
name = "sma-langchain-bdcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Damstat" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-groq>=1.2.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sma-langchain-bdcc = "sma_langchain_bdcc:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
